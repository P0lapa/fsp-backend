services:
  postgres:
    image: postgres:18.1-alpine
    container_name: sports-programming-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sports_programming_db
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - sports_programming_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sports_programming_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-net

  keycloak-db:
    image: postgres:18.1-alpine
    container_name: fsp-keycloak-db2
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: fsp-mailpit2
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - main-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fsp-keycloak2
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - main-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: fsp-sevastopol
        VITE_KEYCLOAK_CLIENT_ID: fsp_react
    image: sports-programming-frontend:latest
    container_name: sports-programming-frontend2
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - keycloak
    networks:
      - main-net

  app:
    build: .
    image: fsp-sevastopol:latest
    container_name: sports-programming-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sports_programming_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./logs:/app/logs
    networks:
      - main-net

volumes:
  sports_programming_db:
  keycloak_db:
    name: keycloak_db_data
    external: true

networks:
  main-net:
    driver: bridge
